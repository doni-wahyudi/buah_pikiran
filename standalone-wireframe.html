<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buah Pikiran — Wireframe Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- React & ReactDOM Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --font-heading: 'Bricolage Grotesque', system-ui, -apple-system, sans-serif;
      --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --font-mono: monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    h1, h2, h3, h4, h5, h6 { font-family: var(--font-heading); letter-spacing: -0.02em; line-height: 1.15; }
      body { font-family: var(--font-sans); background-color: #FAFAFB; color: #111827; line-height: 1.5; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
    
    .container-custom { max-width: 1120px; margin: 0 auto; padding: 0 1.5rem; }

    @keyframes marquee { 0% { transform: translateX(0%); } 100% { transform: translateX(-50%); } }
    .marquee-container { display: flex; overflow: hidden; user-select: none; gap: 2rem; width: 100%; }
    .marquee-track { display: flex; flex-shrink: 0; gap: 3rem; min-width: 100%; animation: marquee 24s linear infinite; align-items: center; }
    .marquee-container:hover .marquee-track { animation-play-state: paused; }

    .modal-overlay {
      position: fixed; inset: 0; background-color: rgba(17, 24, 39, 0.55); backdrop-filter: blur(5px);
      display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 1.25rem;
    }

    .wireframe-btn-peach {
      background-color: #FFC000; color: #111827; font-weight: 800; padding: 12px 28px;
      border-radius: 9999px; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 10px rgba(255, 192, 0, 0.3);
    }
    .wireframe-btn-peach:hover { transform: translateY(-2px); box-shadow: 0 6px 14px rgba(255, 192, 0, 0.45); }

    /* Founder card hover reveal */
    .founder-card {
      background-color: #FFFFFF; border: 1.5px solid #E5E7EB; border-radius: 24px; padding: 2rem 1.5rem;
      text-align: center; transition: all 0.3s ease; position: relative; overflow: hidden;
    }
    .founder-card:hover {
      border-color: #FF5E7E; transform: translateY(-4px); box-shadow: 0 16px 30px -10px rgba(255, 94, 126, 0.15);
    }
    .founder-avatar-wrap {
      width: 120px; height: 120px; margin: 0 auto 1.25rem auto; border-radius: 50%;
      background-color: #F9FAFB; border: 2px dashed #CBD5E1; display: flex; align-items: center;
      justify-content: center; font-size: 3rem; transition: transform 0.3s ease;
    }
    .founder-card:hover .founder-avatar-wrap { transform: scale(1.08); border-color: #FF5E7E; }
    
    .founder-expertise-drawer {
      max-height: 0; opacity: 0; overflow: hidden;
      transition: max-height 0.4s ease, opacity 0.3s ease, margin-top 0.3s ease; margin-top: 0;
    }
    .founder-card:hover .founder-expertise-drawer { max-height: 240px; opacity: 1; margin-top: 1.25rem; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function WireframePlaceholder({ label = 'Media Placeholder', aspectRatio = '16/9', variant = 'gray', height, children }) {
      const isPink = variant === 'pink';
      return (
        <div style={{
          width: '100%',
          height: height || 'auto',
          aspectRatio: height ? undefined : aspectRatio,
          position: 'relative',
          display: 'flex',
          flexDirection: 'column',
          alignItems: 'center',
          justifyContent: 'center',
          borderRadius: '20px',
          backgroundColor: isPink ? '#FF5E7E' : '#F1F3F5',
          color: isPink ? '#FFFFFF' : '#6B7280',
          border: isPink ? '1px solid rgba(0,0,0,0.05)' : '1.5px dashed #D1D5DB',
          overflow: 'hidden',
          padding: '1rem',
          textAlign: 'center'
        }}>
          {!isPink && (
            <svg style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', pointerEvents: 'none', stroke: 'rgba(156,163,175,0.25)', strokeWidth: '1' }}>
              <line x1="0" y1="0" x2="100%" y2="100%" />
              <line x1="100%" y1="0" x2="0" y2="100%" />
            </svg>
          )}
          <div style={{ position: 'relative', zIndex: 2, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '6px' }}>
            <span style={{ fontSize: '1.5rem' }}>🖼️</span>
            <span style={{ fontSize: '0.85rem', fontWeight: 600 }}>{label}</span>
            {aspectRatio && <span style={{ fontSize: '0.7rem', opacity: 0.65 }}>[{aspectRatio}]</span>}
            {children}
          </div>
        </div>
      );
    }

    function MascotIcon({ type = 'hero', size = 100 }) {
      if (type === 'logo') {
        return (
          <svg width={size} height={size} viewBox="0 0 40 40" fill="none">
            <circle cx="20" cy="22" r="16" fill="#FF7B7B" />
            <ellipse cx="14" cy="20" rx="2.5" ry="3.5" fill="#1F2937" />
            <ellipse cx="26" cy="20" rx="2.5" ry="3.5" fill="#1F2937" />
            <path d="M17 26 Q20 29 23 26" stroke="#1F2937" strokeWidth="1.5" strokeLinecap="round" />
            <path d="M20 7 C23 2, 28 5, 26 10 C23 9, 21 8, 20 7 Z" fill="#84CC16" />
          </svg>
        );
      }
      return (
        <div style={{ textAlign: 'center', fontSize: size * 0.45 }}>
          {type === 'hero' ? '🍑⚔️' : type === 'researcher' ? '🍑🔍' : '🍑🍎🍌'}
        </div>
      );
    }

    function BrandMarquee() {
      const brands = ['STARBUCKS', 'CPPrima Seafood', 'SOYJOY', 'Algonova', 'ISMAYA', 'TikTok GO', 'bumame', 'PHYSIOGEL', 'ALVA'];
      const duplicated = [...brands, ...brands, ...brands];

      return (
        <section style={{ padding: '3.5rem 0', backgroundColor: '#FFFFFF', borderTop: '1px solid #E5E7EB', borderBottom: '1px solid #E5E7EB', overflow: 'hidden' }}>
          <div style={{ textAlign: 'center', marginBottom: '2rem' }}>
            <h3 style={{ fontSize: '1.65rem', fontWeight: 900, color: '#111827' }}>Brands we've worked with</h3>
          </div>
          <div className="marquee-container">
            <div className="marquee-track">
              {duplicated.map((name, i) => (
                <div key={i} style={{ display: 'inline-flex', alignItems: 'center', gap: '10px', padding: '12px 22px', background: '#F9FAFB', border: '1px solid #E5E7EB', borderRadius: '10px', fontWeight: 800 }}>
                  <span style={{ width: '8px', height: '8px', borderRadius: '50%', backgroundColor: '#FF7B7B' }}></span>
                  {name}
                </div>
              ))}
            </div>
          </div>
        </section>
      );
    }

    // --- Vertical Service Drum Picker ---
    // Scrolled vertically by clicking the item above and below, not by mouse wheel!
    function VerticalServicePicker({ selectedService, onSelectService, onNext }) {
      const services = [
        '360° Campaign',
        'Branding',
        'Web design',
        'SEO',
        'KOL',
        'Strategic communication',
        'Marketing strategy'
      ];

      const N = services.length;
      const BASE = 7000;
      const ITEM_HEIGHT = 44;
      const GAP = 10;
      const STEP = ITEM_HEIGHT + GAP;
      const CONTAINER_HEIGHT = 162;
      const CENTER_OFFSET = (CONTAINER_HEIGHT - ITEM_HEIGHT) / 2;

      const initIdx = services.indexOf(selectedService) !== -1 ? services.indexOf(selectedService) : 3;
      const [currAbsIdx, setCurrAbsIdx] = React.useState(BASE + initIdx);

      const scrollBy = (delta) => {
        const nextAbs = currAbsIdx + delta;
        setCurrAbsIdx(nextAbs);
        onSelectService(services[((nextAbs % N) + N) % N]);
      };

      const goUp = () => scrollBy(-1);
      const goDown = () => scrollBy(1);

      const visibleIndices = [-2, -1, 0, 1, 2].map(offset => currAbsIdx + offset);
      const translateY = CENTER_OFFSET - currAbsIdx * STEP;

      return (
        <div style={{
          display: 'flex',
          alignItems: 'center',
          justifyContent: 'space-between',
          flexWrap: 'wrap',
          gap: '1.5rem',
          padding: '1.5rem 2.5rem',
          backgroundColor: '#FFF0F2',
          borderRadius: '28px',
          border: '2px dashed #FFB8C2',
          position: 'relative',
          minHeight: '180px'
        }}>
          <div>
            <h3 style={{ fontSize: '2.4rem', fontWeight: 800, color: '#111827', margin: 0, fontFamily: 'var(--font-heading)' }}>
              I need
            </h3>
          </div>

          <div style={{ flex: '1 1 320px', display: 'flex', flexDirection: 'column', alignItems: 'center', position: 'relative' }}>
            <button
              onClick={goUp}
              style={{ background: 'none', border: 'none', cursor: 'pointer', padding: '2px 12px', color: '#FF5E7E', fontSize: '0.9rem', fontWeight: 900 }}
            >
              ▲
            </button>

            <div style={{ width: '100%', maxWidth: '280px', height: `${CONTAINER_HEIGHT}px`, position: 'relative', overflow: 'hidden', borderRadius: '16px' }}>
              <div style={{ position: 'absolute', top: 0, left: 0, right: 0, height: '16px', background: 'linear-gradient(to bottom, #FFF0F2, rgba(255,240,242,0))', zIndex: 6, pointerEvents: 'none' }} />

              <div style={{
                position: 'absolute',
                top: 0, left: 0, right: 0,
                transform: `translateY(${translateY}px)`,
                transition: 'transform 0.35s cubic-bezier(0.25, 1, 0.5, 1)',
                willChange: 'transform'
              }}>
                {visibleIndices.map(absIdx => {
                  const service = services[((absIdx % N) + N) % N];
                  const isCenter = absIdx === currAbsIdx;
                  const isAdjacent = Math.abs(absIdx - currAbsIdx) === 1;
                  const isAbove = absIdx === currAbsIdx - 1;
                  const isBelow = absIdx === currAbsIdx + 1;
                  const topPx = absIdx * STEP;

                  return (
                    <div
                      key={absIdx}
                      onClick={isAbove ? goUp : isBelow ? goDown : undefined}
                      style={{
                        position: 'absolute',
                        top: `${topPx}px`,
                        left: '50%',
                        transform: `translateX(-50%) scale(${isCenter ? 1 : 0.94})`,
                        width: '240px',
                        height: `${ITEM_HEIGHT}px`,
                        display: 'flex',
                        alignItems: 'center',
                        justifyContent: 'center',
                        padding: '0 20px',
                        borderRadius: '9999px',
                        border: isCenter ? '2px solid #EAB308' : '1.5px solid #E5E7EB',
                        backgroundColor: isCenter ? '#FFC000' : '#FFFFFF',
                        color: isCenter ? '#111827' : '#4B5563',
                        fontWeight: isCenter ? 800 : 600,
                        fontSize: isCenter ? '1.05rem' : '0.92rem',
                        fontFamily: 'var(--font-heading)',
                        boxShadow: isCenter ? '0 6px 18px rgba(255, 192, 0, 0.45)' : '0 2px 6px rgba(0,0,0,0.04)',
                        opacity: isCenter ? 1 : isAdjacent ? 0.72 : 0,
                        cursor: isCenter ? 'default' : 'pointer',
                        userSelect: 'none',
                        whiteSpace: 'nowrap',
                        transition: 'all 0.3s ease',
                        zIndex: isCenter ? 5 : 2
                      }}
                    >
                      {service}
                    </div>
                  );
                })}
              </div>

              <div style={{ position: 'absolute', bottom: 0, left: 0, right: 0, height: '16px', background: 'linear-gradient(to top, #FFF0F2, rgba(255,240,242,0))', zIndex: 6, pointerEvents: 'none' }} />
            </div>

            <button
              onClick={goDown}
              style={{ background: 'none', border: 'none', cursor: 'pointer', padding: '2px 12px', color: '#FF5E7E', fontSize: '0.9rem', fontWeight: 900 }}
            >
              ▼
            </button>
          </div>

          <div>
            <button
              onClick={onNext}
              className="wireframe-btn-peach"
              style={{ fontSize: '1.2rem', fontWeight: 800, padding: '14px 34px', boxShadow: '0 6px 18px rgba(255, 192, 0, 0.4)' }}
            >
              <span>Next</span>
              <span style={{ fontSize: '1.35rem', fontWeight: 900 }}>→</span>
            </button>
          </div>
        </div>
      );
    }

    function HomePage({ onNavigate }) {
      const [activeService, setActiveService] = useState('writing');
      const services = [
        { id: 'writing', title: 'Writing Content', desc: 'High-converting copywriting, SEO-driven articles, editorial narratives, and brand storytelling.' },
        { id: 'ads', title: 'Paid Ads', desc: 'Full-funnel media buying across Meta, Google Search/YouTube, TikTok, and Programmatic.' },
        { id: 'message', title: 'Customer Message', desc: 'Direct-to-consumer messaging, WhatsApp conversational marketing, and retention CRM.' }
      ];

      const [selectedPill, setSelectedPill] = useState('SEO');

      return (
        <div>
          {/* Hero */}
          <section style={{ padding: '3.5rem 0 3rem 0', textAlign: 'center' }}>
            <div className="container-custom" style={{ maxWidth: '920px', backgroundColor: '#FFF8F7', padding: '3.5rem 2rem', borderRadius: '32px', border: '1px solid #FFE4E2' }}>
              <h1 style={{ fontSize: 'clamp(2.5rem, 5vw, 4rem)', fontWeight: 900, lineHeight: 1.1 }}>
                Hello!<br />We Are <span style={{ color: '#FF4D6D' }}>Buah Pikiran</span>
              </h1>
              <div style={{ margin: '1.5rem 0' }}>
                <MascotIcon type="hero" size={140} />
              </div>
              <p style={{ fontSize: '1.2rem', color: '#4B5563', lineHeight: 1.6 }}>
                Independent digital 🍑 agency based in Indonesia since 2019. We partner with local and international brands and institutions to build their brand, digital presence and campaigns.
              </p>
            </div>
          </section>

          {/* What we do */}
          <section style={{ padding: '4rem 0' }}>
            <div className="container-custom">
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(320px, 1fr))', gap: '3.5rem', alignItems: 'center' }}>
                <div>
                  <div style={{ height: '360px', backgroundColor: '#FF5E7E', borderRadius: '24px', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', color: '#FFFFFF', padding: '2rem', textAlign: 'center', boxShadow: '0 12px 24px rgba(255, 94, 126, 0.25)' }}>
                    <div style={{ fontSize: '2.5rem', marginBottom: '8px' }}>🖼️</div>
                    <h4 style={{ fontSize: '1.3rem', fontWeight: 900 }}>{services.find(s => s.id === activeService)?.title}</h4>
                    <p style={{ fontSize: '0.85rem', opacity: 0.9, marginTop: '6px' }}>Showcase media for active capability</p>
                  </div>
                </div>
                <div>
                  <div style={{ fontSize: '1.1rem', fontWeight: 700, color: '#6B7280' }}>What we do?</div>
                  <h2 style={{ fontSize: '2.5rem', fontWeight: 900, marginBottom: '1.75rem' }}>Performance</h2>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: '1rem' }}>
                    {services.map(svc => {
                      const isOpen = activeService === svc.id;
                      return (
                        <div key={svc.id} onClick={() => setActiveService(svc.id)} style={{ padding: '1.25rem 1.5rem', backgroundColor: isOpen ? '#FFF5F5' : '#FFFFFF', border: isOpen ? '2px solid #FF5E7E' : '1.5px solid #E5E7EB', borderRadius: '20px', cursor: 'pointer', transition: 'all 0.2s' }}>
                          <div style={{ fontWeight: 800, fontSize: '1.2rem', color: isOpen ? '#FF4D6D' : '#111827' }}>
                            🍑 {svc.title}
                          </div>
                          {isOpen && <p style={{ marginTop: '0.6rem', color: '#4B5563', fontSize: '0.92rem', lineHeight: 1.5 }}>{svc.desc}</p>}
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            </div>
          </section>

          {/* I need (Vertical Drum Picker) */}
          <section style={{ padding: '3rem 0' }}>
            <div className="container-custom">
              <VerticalServicePicker
                selectedService={selectedPill}
                onSelectService={setSelectedPill}
                onNext={() => onNavigate('contact', { service: selectedPill })}
              />
            </div>
          </section>

          <BrandMarquee />

          {/* Testimonial (Peach/Pink Rounded Card) */}
          <section style={{ padding: '4.5rem 0' }}>
            <div className="container-custom" style={{ textAlign: 'center' }}>
              <div style={{ fontSize: '1.5rem', marginBottom: '0.5rem' }}>🍑🍑🍑🍑🍑</div>
              <h2 style={{ fontSize: '2.4rem', fontWeight: 900, marginBottom: '2.5rem' }}>What They Say About Buah Pikiran</h2>
              <div style={{ maxWidth: '920px', margin: '0 auto', padding: '2.5rem', border: '1.5px solid #FFD3D9', borderRadius: '28px', backgroundColor: '#FFF2F4', display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(300px, 1fr))', gap: '2.5rem', alignItems: 'center' }}>
                <div style={{ textAlign: 'left' }}>
                  <p style={{ fontSize: '1.15rem', fontStyle: 'italic', marginBottom: '1.5rem', lineHeight: 1.6 }}>
                    “Buah Pikiran is one of our partners that opens new perspectives and insights on digital strategies. We appreciate its responsiveness for every tasks and discussions in building PLN’s digital presence. Cheers!”
                  </p>
                  <div style={{ fontWeight: 800, fontSize: '1.05rem' }}>Joshia Pardede</div>
                  <div style={{ fontSize: '0.85rem', color: '#6B7280' }}>Corporate Social & Digital Media Officer PT PLN (Persero)</div>
                </div>
                <div style={{ height: '220px', backgroundColor: '#FF5E7E', borderRadius: '20px', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', color: '#FFFFFF', padding: '1rem', textAlign: 'center' }}>
                  <div style={{ fontSize: '2.5rem', marginBottom: '6px' }}>🏢</div>
                  <h4 style={{ fontWeight: 800 }}>Joshia Pardede</h4>
                  <span style={{ fontSize: '0.8rem', opacity: 0.9 }}>Partner Feature</span>
                </div>
              </div>
            </div>
          </section>

          {/* Articles Teaser */}
          <section style={{ padding: '4.5rem 0' }}>
            <div className="container-custom">
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '2.5rem' }}>
                <h2 style={{ fontSize: '2.2rem', fontWeight: 900 }}>Read the Juicy Articles</h2>
                <button onClick={() => onNavigate('articles')} className="wireframe-btn-peach">View more →</button>
              </div>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: '1.75rem' }}>
                {['Zero-Click Searches Are Rising: How to Keep Traffic Alive', 'How Google’s AI Overviews Reshape CTR', 'The Hidden Cost of Inconsistent Messaging'].map((title, i) => (
                  <div key={i} onClick={() => onNavigate('articles')} style={{ backgroundColor: '#FFFFFF', borderRadius: '20px', border: '1.5px solid #E5E7EB', overflow: 'hidden', cursor: 'pointer' }}>
                    <WireframePlaceholder height="190px" label="Article Thumbnail" />
                    <div style={{ padding: '1.25rem' }}>
                      <span style={{ fontSize: '0.75rem', fontWeight: 800, color: '#FF4D6D', backgroundColor: '#FFE4E6', padding: '4px 10px', borderRadius: '6px' }}>SEO & AI Search</span>
                      <h4 style={{ fontWeight: 800, fontSize: '1.05rem', marginTop: '8px' }}>{title}</h4>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </section>

          {/* Recent Projects Teaser */}
          <section style={{ padding: '4.5rem 0' }}>
            <div className="container-custom">
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '2rem' }}>
                <h2 style={{ fontSize: '2.2rem', fontWeight: 900 }}>Recent Project</h2>
                <button onClick={() => onNavigate('works')} className="wireframe-btn-peach">View more →</button>
              </div>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(240px, 1fr))', gap: '1.5rem' }}>
                {['FEMMY FYBER', 'KOMIX', 'FLYJAYA'].map((name, i) => (
                  <div key={i} onClick={() => onNavigate('case-study')} style={{ backgroundColor: '#FFFFFF', borderRadius: '20px', border: '1.5px solid #E5E7EB', overflow: 'hidden', cursor: 'pointer' }}>
                    <WireframePlaceholder height="160px" label={name} />
                    <div style={{ padding: '1rem', fontWeight: 800, display: 'flex', justifyContent: 'space-between' }}>
                      <span>{name}</span>
                      <span style={{ color: '#FF4D6D' }}>→</span>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </section>
        </div>
      );
    }

    function AboutPage({ onNavigate }) {
      const [modal, setModal] = useState(null);

      return (
        <div>
          <section style={{ padding: '3rem 0' }}>
            <div className="container-custom">
              <div style={{ backgroundColor: '#FFF2F4', borderRadius: '32px', border: '1.5px solid #FFD3D9', padding: '3.5rem 3rem', display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(320px, 1fr))', gap: '3rem', alignItems: 'center' }}>
                <div>
                  <h1 style={{ fontSize: '3.2rem', fontWeight: 900, marginBottom: '1rem' }}>About Us</h1>
                  <p style={{ fontSize: '1.3rem', color: '#4B5563', lineHeight: 1.5 }}>
                    Started in 2019, Buah Pikiran build its culture and value to reach global market.
                  </p>
                </div>
                <div style={{ textAlign: 'center' }}>
                  <MascotIcon type="researcher" size={150} />
                </div>
              </div>
            </div>
          </section>

          {/* Values */}
          <section style={{ padding: '4.5rem 0' }}>
            <div className="container-custom">
              <h2 style={{ fontSize: '2.4rem', fontWeight: 900, textAlign: 'center', marginBottom: '3rem' }}>Our value</h2>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(220px, 1fr))', gap: '1.5rem' }}>
                {[
                  { name: 'Boldness', desc: 'Shows boldness in their actions in the role that they’re in.', icon: '🔍' },
                  { name: 'Integrity', desc: 'Shows honesty in their intentions & actions.', icon: '⚖️' },
                  { name: 'Teamwork', desc: 'Communicate clearly their problems/solutions.', icon: '🙌' },
                  { name: 'Effectiveness', desc: 'Do work that shows effective results.', icon: '⏱️' }
                ].map((v, i) => (
                  <div key={i} style={{ backgroundColor: '#FFFFFF', border: '1.5px solid #E5E7EB', borderRadius: '24px', padding: '2rem 1.75rem' }}>
                    <div style={{ display: 'inline-block', backgroundColor: '#FF6B7D', color: '#FFF', fontWeight: 800, padding: '5px 14px', borderRadius: '10px', marginBottom: '1rem' }}>{v.name}</div>
